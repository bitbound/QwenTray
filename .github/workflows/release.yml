name: Build and Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Is prerelease?
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      ASSET_NAME: QwenTray-x64.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Sign CLI
        # Same tool build\WindowsSign.Build.targets uses locally; only prereleases are published.
        run: dotnet tool install --global sign --prerelease

      - name: Import signing certificate
        env:
          SIGN_CERT_PFX_BASE64: ${{ secrets.SIGN_CERT_PFX_BASE64 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:SIGN_CERT_PFX_BASE64) { throw 'Repository secret SIGN_CERT_PFX_BASE64 is not set (base64 of the Bitbound code-signing PFX).' }
          if (-not $env:SIGN_CERT_PASSWORD) { throw 'Repository secret SIGN_CERT_PASSWORD is not set (password of the Bitbound code-signing PFX).' }
          $pfx = Join-Path $env:RUNNER_TEMP 'bitbound.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_CERT_PFX_BASE64))
          # The build's signing targets look for CN=Bitbound in the current user's Personal store.
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:SIGN_CERT_PASSWORD -AsPlainText -Force) | Out-Null
          Remove-Item $pfx

      - name: Calculate version
        id: version
        shell: pwsh
        run: |
          # UTC hour+minute as the revision so two releases on the same day get distinct tags
          # (e.g. v2026.9.26.0244). System.Version sorts these correctly.
          $ver = (Get-Date).ToUniversalTime().ToString('yyyy.M.d.HHmm')
          if ('${{ inputs.prerelease }}' -eq 'true') {
            $ver += '-beta'
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Publish single-file executable
        run: >-
          dotnet publish QwenTray/QwenTray.csproj
          --configuration Release
          --output ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: Prepare release asset
        shell: pwsh
        run: |
          Rename-Item (Get-ChildItem ./artifacts -Filter QwenTray.exe) $env:ASSET_NAME

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: pwsh
        run: |
          $releaseArgs = @(
            $env:TAG,
            "./artifacts/$env:ASSET_NAME",
            '--title', $env:TAG,
            '--generate-notes'
          )
          if ($env:PRERELEASE -eq 'true') {
            $releaseArgs += '--prerelease'
          }
          gh release create @releaseArgs
