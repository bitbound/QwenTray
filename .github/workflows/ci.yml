name: CI

# The release workflow only publishes, and publishing does not run the suite, so before this file no
# commit ever had its tests run. A Windows runner is required rather than chosen: settings.json is
# protected with DPAPI, which throws PlatformNotSupportedException anywhere else.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the test project
        # No certificate and no Sign tool are needed. Authenticode signing lives in
        # build/WindowsSign.Build.targets, is gated on PublishSingleFile, and hooks only publish targets,
        # so a build never reaches it.
        run: dotnet build tests/QwenTray.Tests/QwenTray.Tests.csproj --configuration Release

      - name: Run the suite
        # dotnet test cannot drive this project. The suite uses Microsoft.Testing.Platform, and the .NET
        # 10 SDK rejects the VSTest path for it, so the built executable is run directly.
        shell: pwsh
        run: |
          $runner = Join-Path $env:GITHUB_WORKSPACE 'tests/QwenTray.Tests/bin/Release/net10.0-windows/win-x64/QwenTray.Tests.exe'
          if (-not (Test-Path -LiteralPath $runner)) { throw "Test executable was not produced: $runner" }
          & $runner
          if ($LASTEXITCODE -ne 0) { throw "The test suite failed with exit code $LASTEXITCODE." }
